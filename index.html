<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RISO GRAPHIC — 리소 스타일 샘플</title>
<meta name="description" content="스팟 잉크 두세 통을 한 장에 겹쳐 찍는 리소그래프 인쇄를 캔버스로 흉내 낸다. 분판마다 각도가 다른 망점, 판 어긋남, 곱하기를 실제 인쇄 순서대로 재현하고, 한 장은 이름 붙은 판화 함수 하나다.">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header class="bar">
  <span class="mark">RISO GRAPHIC</span>
  <span class="sub"><span class="tag">SAMPLE SHEET</span></span>
  <span class="status" id="status">BOOT</span>
</header>

<main class="press">
  <canvas id="sheet" width="900" height="1200" aria-label="리소 스타일로 인쇄된 샘플 시트"></canvas>
</main>

<aside class="deck">
  <section class="card">
    <h2>SHEET</h2>
    <button id="reroll" class="wide" type="button">NEW ROLL</button>
    <button id="save" class="wide mt" type="button">PNG</button>
  </section>

  <section class="card">
    <h2 id="plateTitle">PLATE</h2>
    <div class="row seg wrap" id="plates" role="group" aria-label="판화"></div>
    <p class="about" id="about"></p>
  </section>

  <section class="card">
    <h2>MOTION <span class="out" id="frameOut">0 / 48</span></h2>
    <button id="play" class="wide" type="button">PLAY 24FPS</button>
    <input id="scrub" class="mt" type="range" min="0" max="47" value="0" aria-label="프레임">
    <div class="row seg mt" id="loop" role="group" aria-label="루프 길이"></div>
    <div class="row seg mt" id="step" role="group" aria-label="촬영 간격"></div>
  </section>

  <section class="card">
    <h2>BOIL</h2>
    <div class="row seg" id="boil" role="group" aria-label="끓음"></div>
  </section>

  <section class="card">
    <h2>CONTACT SHEET</h2>
    <div class="row seg wrap" id="grid" role="group" aria-label="콘택트 시트"></div>
  </section>

  <section class="card">
    <h2>HEADLINE</h2>
    <input id="headline" type="text" placeholder="배색 이름을 따라감" aria-label="제목">
  </section>

  <section class="card">
    <h2>INKS</h2>
    <div class="palettes" id="palettes" role="group" aria-label="잉크 배색"></div>
  </section>

  <section class="card">
    <h2>DRUMS</h2>
    <div class="row seg" id="drums" role="group" aria-label="드럼 수"></div>
  </section>

  <section class="card">
    <h2>CELL <span class="out" id="cellOut">9 PX</span></h2>
    <input id="cell" type="range" min="3" max="16" value="9" aria-label="망점 셀 크기">
  </section>

  <section class="card">
    <h2>GRAIN <span class="out" id="grainOut">0.35</span></h2>
    <input id="grain" type="range" min="0" max="60" value="35" aria-label="그레인 양">
  </section>

  <section class="card">
    <h2>REGISTER <span class="out" id="registerOut">2 PX</span></h2>
    <input id="register" type="range" min="0" max="5" value="2" aria-label="판 어긋남">
  </section>

  <p class="hint">SPACE 재생 · N 새 롤 · G 콘택트 시트 · S 저장</p>
</aside>

<noscript><p class="noscript">이 페이지는 자바스크립트로 그립니다.</p></noscript>

<script type="module" src="./src/main.js"></script>
</body>
</html>
